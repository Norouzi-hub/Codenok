<!-- DEV-ONLY: در حالت توسعه، باینری SQLite جداگانه خوانده می‌شود -->
<script>
(function () {
  var holder = document.getElementById('sqljs-wasm');
  if (holder.textContent.trim()) return;
  fetch('vendor/sql-wasm.wasm.b64')
    .then(function (r) { return r.text(); })
    .then(function (t) { holder.textContent = t; })
    .catch(function () { /* در حالت file:// در دسترس نیست */ });
})();
</script>
